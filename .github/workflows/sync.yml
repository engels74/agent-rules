name: sync rules

# Fans the canonical rules out to every repo with `publish = true`.
# Repos listed only in a local manifest are hydrated by bin/sync and never
# reach CI.

on:
  push:
    branches: [main]
    paths:
      - 'rules/**'
      - 'manifest.toml'
      - '.github/workflows/sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-rules
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve publishing targets
        run: |
          awk '
            function q(line,   out,n,i,arr) {
              out=""; n=split(line, arr, "\"")
              for (i=2; i<=n; i+=2) out = out (out=="" ? "" : " ") arr[i]
              return out
            }
            function emit() { if (s!="" && pb=="true" && r!="") print s }
            /^\[\[repo\]\]/         { emit(); s=""; r=""; pb="false"; next }
            /^[[:space:]]*slug/     { s=q($0); next }
            /^[[:space:]]*rules/    { r=q($0); next }
            /^[[:space:]]*publish/  { pb=($0 ~ /true/) ? "true" : "false"; next }
            END                     { emit() }
          ' manifest.toml | tee targets.txt
          echo "targets: $(wc -l < targets.txt)"

      - name: Sync
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -uo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::SYNC_TOKEN is not set"; exit 1; }

          ROOT="$RUNNER_TEMP/repos"; mkdir -p "$ROOT"
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          fail=0
          while read -r slug; do
            [ -n "$slug" ] || continue
            dest="$ROOT/$slug"; mkdir -p "$(dirname "$dest")"

            if ! git clone -q --depth 1 \
                 "https://x-access-token:${GH_TOKEN}@github.com/${slug}.git" "$dest"; then
              echo "::error::clone failed: $slug"; fail=1; continue
            fi

            if ! AGENT_RULES_ROOT="$ROOT" ./bin/sync --apply "$slug"; then
              echo "::error::sync failed: $slug"; fail=1; continue
            fi

            if [ -z "$(git -C "$dest" status --porcelain)" ]; then
              echo "unchanged  $slug"; continue
            fi

            git -C "$dest" add -A .agents/rules
            git -C "$dest" commit -q -m "chore: sync agent rules from agent-rules"
            if git -C "$dest" push -q origin HEAD; then
              echo "pushed     $slug"
            else
              echo "::error::push failed: $slug (branch protection?)"; fail=1
            fi
          done < targets.txt

          exit $fail
